<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Q1 WORLD — Building the future of AI with simple, useful and accessible technology."
  >

  <title>Q1 WORLD — The Future of AI Starts Here</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2script>
</head>

<body>

<header class="navbar">
  <div class="container nav-inner">

    <a href="#home" class="brand">Q1 WORLD</a>

    <button
      class="menu-toggle"
      id="menuToggle"
      aria-label="Open navigation menu"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" id="navLinks">

      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#features">Features</a>
      <a href="#vision">Vision</a>
      <a href="#reviews">Reviews</a>

      <button class="auth-nav-btn" id="openLoginBtn">
        Login
      </button>

      <button class="explore-btn" id="openSignupBtn">
        Sign Up
      </button>

      <div class="user-menu hidden" id="userMenu">
        <span id="userName"></span>
        <button id="logoutBtn">Logout</button>
      </div>

    </nav>
  </div>
</header>


<main>

<!-- HERO -->

<section class="hero" id="home">

  <div class="container hero-content">

    <span class="eyebrow">Q1 WORLD</span>

    <h1>The Future of AI Starts Here.</h1>

    <p class="hero-subheading">
      Welcome to Q1 WORLD.
    </p>

    <p class="hero-description">
      Q1 WORLD is building a new generation of AI products designed
      to make technology more useful, accessible and connected.
    </p>

    <div class="hero-actions">

      <a href="#products" class="primary-btn">
        Explore Products
      </a>

      <a href="#vision" class="secondary-btn">
        Our Vision
      </a>

    </div>

  </div>

</section>


<!-- PRODUCTS -->

<section class="section products" id="products">

  <div class="container">

    <div class="section-header">

      <div class="section-label">
        Products
      </div>

      <h2 class="section-title">
        Products Built for the Future
      </h2>

      <p class="section-description">
        Q1 WORLD brings together different AI and digital experiences
        under one ecosystem.
      </p>

    </div>


    <div class="product-grid">

      <article class="product-card">

        <div class="product-number">01</div>

        <h3>Q1 AI</h3>

        <p>
          An intelligent AI assistant designed to help people learn,
          create, explore and solve problems.
        </p>

        <span class="status">
          Coming Soon
        </span>

      </article>


      <article class="product-card">

        <div class="product-number">02</div>

        <h3>Q1 Chat</h3>

        <p>
          A modern AI conversation platform focused on natural
          and useful conversations.
        </p>

        <span class="status development">
          In Development
        </span>

      </article>


      <article class="product-card">

        <div class="product-number">03</div>

        <h3>Q1 Labs</h3>

        <p>
          A space for experimenting with new ideas, technologies
          and intelligent digital experiences.
        </p>

        <span class="status">
          Coming Soon
        </span>

      </article>

    </div>

  </div>

</section>


<!-- FEATURES -->

<section class="section" id="features">

  <div class="container">

    <div class="section-header center">

      <div class="section-label">
        Features
      </div>

      <h2 class="section-title">
        Built Around People
      </h2>

      <p class="section-description">
        Technology should be powerful without being complicated.
      </p>

    </div>


    <div class="feature-grid">

      <article class="feature-card">

        <div class="feature-icon">
          AI
        </div>

        <h3>Intelligent</h3>

        <p>
          AI experiences designed to understand users and provide
          useful results.
        </p>

      </article>


      <article class="feature-card">

        <div class="feature-icon">
          UX
        </div>

        <h3>Simple</h3>

        <p>
          Clean interfaces that make technology easier to use.
        </p>

      </article>


      <article class="feature-card">

        <div class="feature-icon">
          Q1
        </div>

        <h3>Connected</h3>

        <p>
          Different products working together inside one ecosystem.
        </p>

      </article>

    </div>

  </div>

</section>


<!-- NEXT -->

<section class="next-section">

  <div class="container next-content">

    <div class="next-label">
      What's Next
    </div>

    <h2>
      We're building what comes next.
    </h2>

    <p>
      Q1 WORLD is continuously exploring new possibilities across
      artificial intelligence, software and digital technology.
    </p>

    <div class="tags">

      <span class="tag">Artificial Intelligence</span>
      <span class="tag">Software</span>
      <span class="tag">Innovation</span>
      <span class="tag">Digital Products</span>

    </div>

  </div>

</section>


<!-- VISION -->

<section class="section vision" id="vision">

  <div class="container vision-layout">

    <div class="vision-text">

      <div class="section-label">
        Vision
      </div>

      <h2 class="section-title">
        Technology for everyone.
      </h2>

      <p>
        Our vision is to build technology that feels natural,
        useful and accessible. Q1 WORLD aims to create products
        that help people learn, create, communicate and discover
        new possibilities.
      </p>

    </div>


    <div class="vision-statement">

      Build useful technology.
      Make it simple.
      Keep moving forward.

    </div>

  </div>

</section>


<!-- REVIEWS -->

<section class="section reviews" id="reviews">

  <div class="container">

    <div class="review-box">

      <h3>
        Help us improve Q1 WORLD.
      </h3>

      <p>
        Your feedback helps us understand what we should build next.
      </p>

      <p class="review-question">
        Have an idea or suggestion?
      </p>

      <a
        href="mailto:q1worldofficial@gmail.com"
        class="review-email"
      >
        q1worldofficial@gmail.com
      </a>

      <br>

      <a
        href="mailto:q1worldofficial@gmail.com"
        class="review-btn"
      >
        Send Feedback
      </a>

    </div>

  </div>

</section>

</main>


<!-- FOOTER -->

<footer>

  <div class="container footer-inner">

    <div>

      <div class="footer-brand">
        Q1 WORLD
      </div>

      <div class="footer-tagline">
        The Future of AI Starts Here.
      </div>

    </div>

    <div class="copyright">
      © 2026 Q1 WORLD. All rights reserved.
    </div>

  </div>

</footer>



<!-- AUTH MODAL -->

<div class="modal-overlay hidden" id="authModal">

  <div class="auth-modal">

    <button
      class="modal-close"
      id="closeAuthBtn"
      aria-label="Close"
    >
      ×
    </button>


    <!-- LOGIN -->

    <div id="loginForm">

      <div class="auth-header">

        <span class="auth-label">
          Q1 WORLD
        </span>

        <h2>
          Welcome back
        </h2>

        <p>
          Login to your Q1 WORLD account.
        </p>

      </div>


      <form id="loginFormElement">

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="you@example.com"
          required
          autocomplete="email"
        >


        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Your password"
          required
          autocomplete="current-password"
        >


        <button
          type="submit"
          class="auth-submit"
        >
          Login
        </button>

      </form>


      <p class="auth-switch">

        Don't have an account?

        <button id="switchToSignup">
          Sign Up
        </button>

      </p>

    </div>



    <!-- SIGNUP -->

    <div id="signupForm" class="hidden">

      <div class="auth-header">

        <span class="auth-label">
          Q1 WORLD
        </span>

        <h2>
          Create account
        </h2>

        <p>
          Join Q1 WORLD today.
        </p>

      </div>


      <form id="signupFormElement">

        <label for="signupName">
          Name
        </label>

        <input
          type="text"
          id="signupName"
          placeholder="Your name"
          required
          maxlength="80"
          autocomplete="name"
        >


        <label for="signupEmail">
          Email
        </label>

        <input
          type="email"
          id="signupEmail"
          placeholder="you@example.com"
          required
          autocomplete="email"
        >


        <label for="signupPassword">
          Password
        </label>

        <input
          type="password"
          id="signupPassword"
          placeholder="Create a password"
          required
          minlength="6"
          autocomplete="new-password"
        >


        <button
          type="submit"
          class="auth-submit"
        >
          Create Account
        </button>

      </form>


      <p class="auth-switch">

        Already have an account?

        <button id="switchToLogin">
          Login
        </button>

      </p>

    </div>


    <div
      id="authMessage"
      class="auth-message"
      role="status"
      aria-live="polite"
    ></div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
